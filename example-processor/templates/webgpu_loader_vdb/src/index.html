<html>
  <head>
    <title>three.js webgpu - loaders - VDB loader</title>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0"
    />
    <meta
      property="og:title"
      content="three.js webgpu - loaders - VDB loader"
    />
    <meta property="og:type" content="website" />
    <meta
      property="og:url"
      content="https://threejs.org/examples/webgpu_loader_vdb.html"
    />
    <meta
      property="og:image"
      content="https://threejs.org/examples/screenshots/webgpu_loader_vdb.jpg"
    />
    <link type="text/css" rel="stylesheet" href="example.css" />
  </head>

  <body style="overflow: hidden">
    <div id="info">
      <a
        href="https://threejs.org/"
        target="_blank"
        rel="noopener"
        class="logo-link"
      ></a>

      <div class="title-wrapper">
        <a href="https://threejs.org/" target="_blank" rel="noopener"
          >three.js</a
        ><span>OpenVDB / NanoVDB Loader</span>
      </div>

      <small>
        Fire simulations loaded with
        <a
          href="https://github.com/richardmonette/three-vdb-loader"
          target="_blank"
          rel="noopener"
          >three-vdb-loader</a
        >, as an animated
        <a
          href="https://www.openvdb.org/documentation/doxygen/NanoVDB_MainPage.html"
          target="_blank"
          rel="noopener"
          >NanoVDB</a
        >
        sequence or a single
        <a href="https://www.openvdb.org/" target="_blank" rel="noopener"
          >OpenVDB</a
        >
        file. Created by
        <a
          href="https://github.com/richardmonette"
          target="_blank"
          rel="noopener"
          >Richard Monette</a
        >.<br />
        <span id="status"></span>
      </small>
    </div>

    <script type="importmap">
      {
        "imports": {
          "three": "../build/three.webgpu.js",
          "three/webgpu": "../build/three.webgpu.js",
          "three/tsl": "../build/three.tsl.js",
          "three/addons/": "./jsm/",
          "three-vdb-loader": "https://cdn.jsdelivr.net/npm/three-vdb-loader@0.4.2/VDBLoader.js",
          "three-vdb-loader/sequence": "https://cdn.jsdelivr.net/npm/three-vdb-loader@0.4.2/VDBSequenceLoader.js"
        }
      }
    </script>
  </body>
</html>
