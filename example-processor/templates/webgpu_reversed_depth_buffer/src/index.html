<html>
  <head>
    <title>three.js webgpu - reverse depth buffer</title>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0"
    />
    <meta
      property="og:title"
      content="three.js webgpu - reverse depth buffer"
    />
    <meta property="og:type" content="website" />
    <meta
      property="og:url"
      content="https://threejs.org/examples/webgpu_reversed_depth_buffer.html"
    />
    <meta
      property="og:image"

    <script type="importmap">
      {
        "imports": {
